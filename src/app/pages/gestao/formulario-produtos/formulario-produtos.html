<div class="pagina">
    <main class="content-container">
        <h1>Formulário de Cadastro de Produtos</h1>

        <form class="formulario">

            <div class="campo campo-id">
                @if (produtoId) {
                <label for="id">ID</label>
                <input id="id" name="id" type="text" [ngModel]="produto.id" disabled [(ngModel)]="produto.id" />
                }

            </div>

            <div class="campo campo-nome">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto"
                    [(ngModel)]="produto.nome" required />
            </div>

            <div class="campo campo-imagem">
                <label for="imagem">Imagem</label>
                <input type="text" id="imagem" name="imagem" placeholder="Defina a imagem do produto do produto"
                    required [(ngModel)]="produto.imagem" />
            </div>


            <div class="campo-flex">
                <div class="campo campo-preco">
                    <label for="preco">Preço</label>
                    <input type="number" id="preco" name="preco" placeholder="Digite o preço"
                        [(ngModel)]="produto.preco" />
                </div>
                <div class="campo campo-desconto">
                    <label for="desconto">Desconto</label>
                    <input type="number" id="desconto" name="desconto" placeholder="Digite o preço"
                        [(ngModel)]="produto.desconto" />
                </div>
            </div>


            <div class="campo campo-marca">
                <label for="marca">Marca</label>
                <input type="text" id="marca" name="marca" placeholder="Digite a marca do produto" required
                    [(ngModel)]="produto.marca" />
            </div>

            <div class="campo campo-categoria">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" name="categoria" placeholder="Digite a categoria do produto" required
                    [(ngModel)]="produto.categoria" />
            </div>

            <div class="campo campo-estoque">
                <label for="estoque">Estoque</label>
                <input type="number" id="estoque" name="estoque" placeholder="Digite a quantidade em estoque"
                    [(ngModel)]="produto.estoque" />
            </div>

            <button type="submit" class="btn-cadastrar" (click)="salvar()">
                Cadastrar Produto
            </button>
        </form>
    </main>
</div>
